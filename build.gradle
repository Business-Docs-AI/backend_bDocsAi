plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com.example.senac'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Banco de dados
    runtimeOnly 'org.postgresql:postgresql'

    // Migrations
    // No Spring Boot 4.1 a autoconfiguração do Flyway virou módulo próprio, separado da
    // biblioteca em si — sem ele, o Flyway nunca roda e o Hibernate falha a validação do
    // schema contra um banco vazio.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    // Sanitização de HTML
    implementation 'org.jsoup:jsoup:1.18.1'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // LangChain4j
    implementation 'dev.langchain4j:langchain4j:1.18.0'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.18.0'
    implementation 'dev.langchain4j:langchain4j-anthropic:1.18.0'
    implementation 'dev.langchain4j:langchain4j-google-ai-gemini:1.18.0'

    // Embedding local (ONNX, roda em processo, sem chave/API nenhuma) — provedor padrão,
    // para o projeto funcionar sem depender de uma chave da OpenAI.
    implementation 'dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2-q:1.0.0-beta5'

    // LangChain4j + PGVector
    implementation 'dev.langchain4j:langchain4j-pgvector:1.18.0-beta28'

    // Testes
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
