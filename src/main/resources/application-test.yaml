spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-test
    # Mesmo motivo do application-dev.yaml: o seed (migration-test/V9000) usa um número alto
    # de propósito para rodar sempre por último.
    out-of-order: true

logging:
  level:
    root: WARN