spring:
  application:
    name: businessDocsAi

  jpa:
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # Áudio/anexo enviados no chat (ver ChatController#enviarMensagemComArquivo) — o
      # default do Spring (1MB) é pequeno demais até para um áudio curto.
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080

app:
  cors:
    # Origens do frontend liberadas para chamar a API (separadas por vírgula via env
    # CORS_ALLOWED_ORIGINS). Default cobre as portas de dev mais comuns (Vite, CRA/Next, Angular).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  ai:
    # Provedor do modelo de CHAT: "gemini" (padrão, gratuito), "anthropic" ou "openai".
    chat-provider: ${AI_CHAT_PROVIDER:gemini}
    # Provedor de EMBEDDING: "local" (padrão, ONNX em processo, sem chave nenhuma) ou "openai".
    embedding-provider: ${AI_EMBEDDING_PROVIDER:local}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimension: ${OPENAI_EMBEDDING_DIMENSION:1536}
    local-embedding-dimension: 384
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-chat-model: ${ANTHROPIC_CHAT_MODEL:claude-sonnet-5}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-chat-model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
  reindexacao:
    intervalo-ms: ${REINDEXACAO_INTERVALO_MS:300000}
  chat:
    # A partir de quantos caracteres uma mensagem colada no chat é considerada "texto
    # grande" e convertida para Markdown antes de ser salva (ver MarkdownConversorService).
    limite-caracteres-texto-grande: ${CHAT_LIMITE_CARACTERES_TEXTO_GRANDE:2000}

bdocs:
  documentacao-estruturada:
    # Com false (default), o sistema se comporta exatamente como antes desta entrega —
    # ver FeatureFlags e docs/plano-documentacao-estruturada.md.
    enabled: ${DOCUMENTACAO_ESTRUTURADA_ENABLED:false}
    # Provedores de chat em que o caminho de documento estruturado fica disponível
    # (decisão A3: nunca fixo no código, sempre configurável). Default corrigido pra
    # "anthropic" só — a Etapa 10 encontrou uma incompatibilidade de function calling do
    # Gemini (gemini-3.8-flash + langchain4j-google-ai-gemini:1.18.0) com qualquer
    # tool-calling via AiServices, não só com o DTO estruturado (ver plano, "Problema
    # separado: Gemini").
    provedores: ${DOCUMENTACAO_ESTRUTURADA_PROVEDORES:anthropic}
    geracao:
      # Validado na Etapa 11b: um documento estruturado completo precisa de bem mais que o
      # maxTokens do chat interativo (8192) — estes valores valem SÓ para o ChatModel
      # dedicado do worker (Etapa 13.2), nunca para o chatModel do chat interativo.
      max-tokens: ${DOCUMENTACAO_ESTRUTURADA_GERACAO_MAX_TOKENS:16384}
      timeout-segundos: ${DOCUMENTACAO_ESTRUTURADA_GERACAO_TIMEOUT_SEGUNDOS:240}
      # Tentativas automáticas do CLIENTE HTTP do langchain4j (nível de chamada à API),
      # separadas das tentativas do R3 (nível de rascunho, ver max-tentativas abaixo). O
      # default do langchain4j é 2 (3 chamadas por tentativa) — mantemos 0 aqui para que só
      # o R3 decida se vale a pena gerar de novo (cada chamada já custa ~14k tokens).
      max-retries-http: ${DOCUMENTACAO_ESTRUTURADA_GERACAO_MAX_RETRIES_HTTP:0}
      # R3: limite de tentativas por rascunho antes de desistir (ERRO_GERACAO).
      max-tentativas: ${DOCUMENTACAO_ESTRUTURADA_GERACAO_MAX_TENTATIVAS:2}
      # R3: o job de segurança só considera um rascunho "preso" em GERANDO após esse tempo
      # sem terminar (cobre evento perdido ou processo reiniciado no meio).
      timeout-gerando-minutos: ${DOCUMENTACAO_ESTRUTURADA_GERACAO_TIMEOUT_GERANDO_MINUTOS:5}
      intervalo-job-ms: ${DOCUMENTACAO_ESTRUTURADA_GERACAO_INTERVALO_JOB_MS:60000}
      # R4: limite de tamanho do material-fonte (histórico da conversa + anexos/áudio já
      # extraídos + instruções) — acima disso, ERRO_GERACAO com mensagem clara em vez de
      # uma chamada lenta/cara sem necessidade.
      material-max-caracteres: ${DOCUMENTACAO_ESTRUTURADA_GERACAO_MATERIAL_MAX_CARACTERES:60000}
      # Etapa 13.6 (teste manual de ponta a ponta sem gastar créditos da API real): com
      # true, o worker NUNCA chama a Anthropic — devolve um documento de exemplo (fixo,
      # válido) depois de alguns segundos. Default false. NUNCA deve ser true em produção —
      # existe só para exercitar reserva/concorrência/polling/UI do fluxo assíncrono.
      modelo-fake: ${DOCUMENTACAO_ESTRUTURADA_GERACAO_MODELO_FAKE:false}
      # Atraso do modo modelo-fake antes de devolver o documento de exemplo — só pra UI ter
      # o estado GERANDO pra mostrar; não simula a latência real da Anthropic.
      modelo-fake-atraso-ms: ${DOCUMENTACAO_ESTRUTURADA_GERACAO_MODELO_FAKE_ATRASO_MS:5000}
  rag:
    filtros-ciclo-vida:
      # Etapa 16 — decisão B4: a GRAVAÇÃO dos metadados no chunk (Etapa 14) e os gatilhos de
      # reindexação por metadado (Etapa 17) ficam sempre ligados, independente desta flag;
      # só a LEITURA/filtro na busca (pré-filtro + checagem de status no filtro pós-busca)
      # fica atrás dela. Default false: com ela desligada, RagAssistantConfig e
      # PesquisaService se comportam exatamente como antes da Etapa 16.
      enabled: ${RAG_FILTROS_CICLO_VIDA_ENABLED:false}
      # B5: proteção automática — se existir QUALQUER chunk em documento_embedding sem
      # status_ciclo_vida/categoria_id (nunca reindexado desde a Etapa 14), o pré-filtro
      # fica desligado (mesmo com a flag true) até a reindexação em massa (Etapa 15) ser
      # rodada — nunca excluir um documento do RAG por falta de metadado. Cache em memória
      # pra não bater no banco a cada busca; TTL curto o bastante pra refletir uma
      # reindexação em massa recém-concluída em tempo razoável.
      cache-ttl-minutos: ${RAG_FILTROS_CICLO_VIDA_CACHE_TTL_MINUTOS:5}