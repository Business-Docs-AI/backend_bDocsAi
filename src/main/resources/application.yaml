spring:
  application:
    name: businessDocsAi

  jpa:
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # Áudio/anexo enviados no chat (ver ChatController#enviarMensagemComArquivo) — o
      # default do Spring (1MB) é pequeno demais até para um áudio curto.
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080

app:
  cors:
    # Origens do frontend liberadas para chamar a API (separadas por vírgula via env
    # CORS_ALLOWED_ORIGINS). Default cobre as portas de dev mais comuns (Vite, CRA/Next, Angular).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  ai:
    # Provedor do modelo de CHAT: "gemini" (padrão, gratuito), "anthropic" ou "openai".
    chat-provider: ${AI_CHAT_PROVIDER:gemini}
    # Provedor de EMBEDDING: "local" (padrão, ONNX em processo, sem chave nenhuma) ou "openai".
    embedding-provider: ${AI_EMBEDDING_PROVIDER:local}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimension: ${OPENAI_EMBEDDING_DIMENSION:1536}
    local-embedding-dimension: 384
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-chat-model: ${ANTHROPIC_CHAT_MODEL:claude-sonnet-5}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-chat-model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
  reindexacao:
    intervalo-ms: ${REINDEXACAO_INTERVALO_MS:300000}
  chat:
    # A partir de quantos caracteres uma mensagem colada no chat é considerada "texto
    # grande" e convertida para Markdown antes de ser salva (ver MarkdownConversorService).
    limite-caracteres-texto-grande: ${CHAT_LIMITE_CARACTERES_TEXTO_GRANDE:2000}