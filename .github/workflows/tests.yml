name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    # Só contra a branch principal do repositório — sem isso, todo PR roda o
    # job duas vezes (uma pelo push na branch de origem, outra pelo próprio PR).
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: business_docs_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Rodar a suíte de testes
        env:
          SPRING_PROFILES_ACTIVE: test
          TEST_DB_URL: jdbc:postgresql://localhost:5432/business_docs_ai_test
          TEST_DB_USERNAME: postgres
          TEST_DB_PASSWORD: postgres
          # Fictício, só para os testes rodarem no CI — nunca usar em produção.
          JWT_SECRET: "ci-fake-secret-nao-usar-em-producao-0000000000"
        run: ./gradlew test --no-daemon

      - name: Publicar relatório de testes em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
