services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: business-docs-ai-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev

      DB_URL: jdbc:postgresql://postgres:5432/business_docs_ai_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}

      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-gemini}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-local}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSION: ${OPENAI_EMBEDDING_DIMENSION:-1536}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-sonnet-5}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.8-flash}

      # Documentação estruturada (Etapa 1+) — defaults iguais aos de application.yaml, pra
      # não mudar nada do comportamento atual quando não definidas.
      DOCUMENTACAO_ESTRUTURADA_ENABLED: ${DOCUMENTACAO_ESTRUTURADA_ENABLED:-false}
      DOCUMENTACAO_ESTRUTURADA_PROVEDORES: ${DOCUMENTACAO_ESTRUTURADA_PROVEDORES:-anthropic}
      DOCUMENTACAO_ESTRUTURADA_GERACAO_MODELO_FAKE: ${DOCUMENTACAO_ESTRUTURADA_GERACAO_MODELO_FAKE:-false}
      DOCUMENTACAO_ESTRUTURADA_GERACAO_MODELO_FAKE_ATRASO_MS: ${DOCUMENTACAO_ESTRUTURADA_GERACAO_MODELO_FAKE_ATRASO_MS:-5000}
      RAG_FILTROS_CICLO_VIDA_ENABLED: ${RAG_FILTROS_CICLO_VIDA_ENABLED:-false}

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: business-docs-ai-postgres
    environment:
      POSTGRES_DB: business_docs_ai_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d business_docs_ai_dev" ]
      interval: 10s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: business-docs-ai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@businessdocs.ai
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

volumes:
  postgres_data: