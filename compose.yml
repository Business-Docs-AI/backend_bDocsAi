services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: business-docs-ai-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev

      DB_URL: jdbc:postgresql://postgres:5432/business_docs_ai_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: business-docs-ai-postgres
    environment:
      POSTGRES_DB: business_docs_ai_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d business_docs_ai_dev" ]
      interval: 10s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: business-docs-ai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@businessdocs.ai
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

volumes:
  postgres_data: